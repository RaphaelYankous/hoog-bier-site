    <style>
      /* Tela de abertura estática: aparece instantaneamente, antes mesmo do JS. */
      #boot{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:#0f0e0c;transition:opacity .55s ease,transform .7s cubic-bezier(.7,0,.2,1)}
      #boot.boot-out{opacity:0;transform:translateY(-6%);pointer-events:none}
      #boot img{width:132px;height:auto;animation:bootpulse 1.6s ease-in-out infinite}
      #boot i{display:block;width:150px;height:3px;margin:22px auto 0;background:#27272a;border-radius:9px;overflow:hidden}
      #boot i::after{content:"";display:block;height:100%;width:40%;background:#f59e0b;border-radius:9px;animation:bootbar 1.1s ease-in-out infinite}
      @keyframes bootpulse{50%{transform:scale(1.05);filter:drop-shadow(0 0 18px rgba(245,158,11,.55))}}
      @keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
      html{background:#0f0e0c}
    </style>
