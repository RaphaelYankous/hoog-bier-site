    <style>
      /* Tela de abertura estática: o logo "enche" de cerveja antes mesmo do JS carregar. */
      html{background:#0f0e0c}
      #boot{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:#0f0e0c;color:#a8a29e;clip-path:inset(0 0 0 0);transition:clip-path 1s cubic-bezier(.77,0,.18,1)}
      #boot.boot-out{clip-path:inset(0 0 100% 0);pointer-events:none}
      #boot .lg{position:relative;width:184px;height:123px}
      #boot .lg::before,#boot .lq{position:absolute;inset:0;-webkit-mask:url(/images/logo-hoog.png) center/contain no-repeat;mask:url(/images/logo-hoog.png) center/contain no-repeat}
      #boot .lg::before{content:"";background:#2a2622}
      #boot .lq{overflow:hidden}
      #boot .lq i{position:absolute;left:-50%;width:200%;height:160%;top:100%;background:linear-gradient(#fef3c7 0 6%,#fbbf24 8%,#f59e0b 35%,#b45309);border-radius:42%;animation:bootfill 1.5s cubic-bezier(.55,0,.25,1) forwards,bootspin 2.4s linear infinite}
      #boot p{margin:26px 0 0;font:600 11px/1 system-ui,sans-serif;letter-spacing:.42em;text-transform:uppercase;text-align:center;opacity:0;animation:bootfade .6s .3s forwards}
      .boot-fast #boot .lq i{animation-duration:.5s,2.4s}
      .boot-fast #boot p{display:none}
      @keyframes bootfill{to{top:-30%}}
      @keyframes bootspin{to{transform:rotate(360deg)}}
      @keyframes bootfade{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#boot{transition:none}#boot .lq i{animation:none;top:-30%}}
    </style>
    <noscript><style>#boot{display:none}</style></noscript>
